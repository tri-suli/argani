name: check

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version check compares against the last v* tag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Claude Code CLI (plugin validation only; no login needed)
        run: npm install -g @anthropic-ai/claude-code@2.1.312
      - name: Install test dependencies
        run: python3 -m pip install pytest
      - name: Run every repository check
        run: bash scripts/check.sh
